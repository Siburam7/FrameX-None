<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header-root"></div>

  <main id="main">
    <section class="page-hero" aria-labelledby="page-title">
      <div class="container">
        <nav class="page-hero__crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span
            aria-hidden="true">/</span> <span aria-current="page">Contact</span></nav>
        <p class="eyebrow">Get in touch</p>
        <h1 class="page-hero__title" id="page-title">Contact <span>us</span></h1>
        <p class="page-hero__lead">Questions about a frame, a custom size, or a shop? Send us a message.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="form-title">
      <div class="container split split--asym">
        <div data-reveal>
          <h2 class="section-title" id="form-title">Send a message</h2>
          <form id="contact-form" class="form-grid" novalidate style="margin-top:20px">
            <div class="form-grid form-grid--2">
              <div class="form-field" data-invalid="false"><label for="c-name">Name</label><input id="c-name"
                  name="name" type="text" autocomplete="name" required>
                <p class="form-field__error" id="c-name-err"><svg class="icon" aria-hidden="true">
                    <use href="#i-alert"></use>
                  </svg><span></span></p>
              </div>
              <div class="form-field" data-invalid="false"><label for="c-email">Email</label><input id="c-email"
                  name="email" type="email" autocomplete="email" required>
                <p class="form-field__error"><svg class="icon" aria-hidden="true">
                    <use href="#i-alert"></use>
                  </svg><span></span></p>
              </div>
            </div>
            <div class="form-grid form-grid--2">
              <div class="form-field" data-invalid="false"><label for="c-phone">Phone <span
                    class="hint">(optional)</span></label><input id="c-phone" name="phone" type="tel"
                  autocomplete="tel">
                <p class="form-field__error"><svg class="icon" aria-hidden="true">
                    <use href="#i-alert"></use>
                  </svg><span></span></p>
              </div>
              <div class="form-field" data-invalid="false"><label for="c-subject">Subject</label><input id="c-subject"
                  name="subject" type="text" required>
                <p class="form-field__error"><svg class="icon" aria-hidden="true">
                    <use href="#i-alert"></use>
                  </svg><span></span></p>
              </div>
            </div>
            <div class="form-field" data-invalid="false"><label for="c-message">Message</label><textarea id="c-message"
                name="message" rows="6" required></textarea>
              <p class="form-field__error"><svg class="icon" aria-hidden="true">
                  <use href="#i-alert"></use>
                </svg><span></span></p>
            </div>
            <div class="visually-hidden" aria-hidden="true"><label for="c-fxhp">Leave this box empty</label><input id="c-fxhp"
                name="fxhp" type="text" tabindex="-1" autocomplete="off"></div>
            <div id="contact-status" class="form-status" role="status" aria-live="polite"></div>
            <div><button class="btn btn--dark" type="submit">Send message</button></div>
          </form>
        </div>
        <aside data-reveal aria-labelledby="info-title">
          <h2 class="section-title" id="info-title">Contact details</h2>
          <div id="contact-info" class="contact-info"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="site-footer-root"></div>
  <div id="overlay-root"></div>
