# Render blueprint for the FrameX backend (optional: any Node.js host works).
# The website itself stays on GitHub Pages. See backend/README.md → Deploy.
# Values marked "sync: false" are secrets you type into Render's dashboard;
# nothing secret is stored in this file.
services:
  - type: web
    name: framex-api
    runtime: node
    # No rootDir: the backend reads the website's catalogue files (js/, assets/js/)
    # for products and prices, so the whole repository is deployed.
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    # Customer photos and shop product pictures are FILES. They must be on a disk that survives restarts and
    # redeploys, or every uploaded photo is lost (orders that need them could not be printed). Uncomment this
    # block (persistent disks need a paid Render plan) and keep UPLOAD_DIR below pointing at the same path.
    # disk:
    #   name: framex-uploads
    #   mountPath: /var/data
    #   sizeGB: 10
    envVars:
      # Where uploaded files are kept: a folder on the persistent disk above, e.g. /var/data/uploads.
      # Left empty, files go to the service's own (temporary) disk and are lost on a restart.
      - key: UPLOAD_DIR
        sync: false
      # Without a persistent disk (Render's free plan): keep uploaded files in a private bucket of an
      # S3-compatible object store instead (Cloudflare R2, Backblaze B2 ...). Fill these five in the
      # dashboard; the two keys are secrets. Left empty, files stay on the service's own temporary disk.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # The website's public address, e.g. https://siburam7.github.io/FrameX-None (used in reset links)
      - key: FRONTEND_URL
        sync: false
      # The website's origin, e.g. https://siburam7.github.io
      - key: CORS_ORIGINS
        sync: false
      # GitHub Pages and this host are different sites, so the session travels as a bearer token.
      - key: AUTH_ALLOW_BEARER
        value: "true"
      # Email: Brevo. Until the key and a verified sender are filled in, the website says
      # "Email service is not configured." (the logs and "npm run doctor" say what is missing).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMS codes: Fast2SMS. Set SMS_PROVIDER to "none" to launch with email only.
      - key: SMS_PROVIDER
        value: fast2sms
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_TEMPLATE_ID
        sync: false
      # Online payments: Cashfree. Start in test mode; switch PAYMENT_MODE to "live" with production keys when ready.
      # Webhook to add at Cashfree:  https://<this service's address>/api/payments/webhook/cashfree
      - key: PAYMENT_PROVIDER
        value: cashfree
      - key: PAYMENT_MODE
        value: test
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: "2025-01-01"
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      # This service's own public address, so Cashfree is told where to send webhooks.
      - key: PUBLIC_API_URL
        sync: false
      # Custom paintings: the part paid before the artist starts (an admin can change it in the dashboard).
      - key: CUSTOM_PAINTING_ADVANCE_PERCENT
        value: "40"
      # Your delivery charge, tax and Cash on Delivery rules (see backend/.env.example).
      - key: SHIPPING_FEE
        value: "0"
      - key: TAX_PERCENT
        value: "0"
      - key: COD_ENABLED
        value: "true"
      - key: COD_FEE
        value: "0"
      # Gift wrapping at checkout: your charge per order, in whole rupees.
      - key: GIFT_WRAP_ENABLED
        value: "true"
      - key: GIFT_WRAP_FEE
        value: "49"
      # true = a shop's first "Publish" waits until a FrameX admin approves the product.
      - key: PRODUCT_MODERATION
        value: "false"
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_CONTACT_EMAIL
        sync: false
