# Render blueprint for the FrameX backend (optional: any Node.js host works).
# The website itself stays on GitHub Pages. See backend/README.md → Deploy.
# Values marked "sync: false" are typed into Render's dashboard: the secrets, and every setting that differs
# between a test and the live service (payments, fees, SMS). Applying this blueprint never changes them, so it
# can't switch the live service to test mode or reset its fees. Nothing secret is stored in this file.
# Every key the backend reads is described in backend/.env.example.
services:
  - type: web
    name: framex-api
    runtime: node
    # No rootDir: the backend reads the website's catalogue files (js/, assets/js/)
    # for products and prices, so the whole repository is deployed.
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    # Customer photos and shop product pictures are FILES. They must be on a disk that survives restarts and
    # redeploys, or every uploaded photo is lost (orders that need them could not be printed). Uncomment this
    # block (persistent disks need a paid Render plan) and keep UPLOAD_DIR below pointing at the same path.
    # disk:
    #   name: framex-uploads
    #   mountPath: /var/data
    #   sizeGB: 10
    envVars:
      # Where uploaded files are kept: a folder on the persistent disk above, e.g. /var/data/uploads.
      # Left empty, files go to the service's own (temporary) disk and are lost on a restart.
      # Where uploaded files are kept: "s3" (the private bucket below; needed on the free plan) or "disk".
      - key: STORAGE_PROVIDER
        sync: false
      - key: UPLOAD_DIR
        sync: false
      # Without a persistent disk (Render's free plan): keep uploaded files in a private bucket of an
      # S3-compatible object store instead (Cloudflare R2, Backblaze B2 ...). Fill these five in the
      # dashboard; the two keys are secrets. Left empty, files stay on the service's own temporary disk.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      # How many proxies stand between a visitor and this server. On Render that is 3 (Cloudflare, Render's
      # router and the one in front of the service). With a smaller number every visitor looks like the same
      # address, and they all share one request limit. Check it at /api/health/client: "seenAs" must be the
      # start of your own address, not 10.x or 172.x.
      - key: TRUST_PROXY
        value: "3"
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # The website's public address, e.g. https://siburam7.github.io/FrameX-None (used in reset links)
      - key: FRONTEND_URL
        sync: false
      # The website's origin, e.g. https://siburam7.github.io
      - key: CORS_ORIGINS
        sync: false
      # GitHub Pages and this host are different sites, so the session travels as a bearer token.
      - key: AUTH_ALLOW_BEARER
        value: "true"
      # Email: Brevo. Until the key and a verified sender are filled in, the website says
      # "Email service is not configured." (the logs and "npm run doctor" say what is missing).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMS codes: "fast2sms", or "none" to launch with email only.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_TEMPLATE_ID
        sync: false
      # Online payments: PAYMENT_PROVIDER "razorpay" or "cashfree"; PAYMENT_MODE "test", then "live" with production keys.
      # Webhook to add at the gateway:  https://<this service's address>/api/payments/webhook/<razorpay|cashfree>
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYMENT_MODE
        sync: false
      # Razorpay (when PAYMENT_PROVIDER is razorpay)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Cashfree (when PAYMENT_PROVIDER is cashfree)
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: "2025-01-01"
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      # This service's own public address, so Cashfree is told where to send webhooks.
      - key: PUBLIC_API_URL
        sync: false
      # Custom paintings: the part paid before the artist starts (an admin can change it in the dashboard).
      - key: CUSTOM_PAINTING_ADVANCE_PERCENT
        value: "40"
      # Your delivery charge, tax and Cash on Delivery rules (see backend/.env.example). An admin can also change
      # most of them in the dashboard (Settings), which then wins over these.
      - key: SHIPPING_FEE
        sync: false
      - key: SHIPPING_FREE_ABOVE
        sync: false
      - key: FIRST_ORDER_FREE_DELIVERY
        sync: false
      - key: TAX_PERCENT
        sync: false
      - key: COD_ENABLED
        value: "true"
      - key: COD_FEE
        sync: false
      # Gift wrapping at checkout: your charge per order, in whole rupees.
      - key: GIFT_WRAP_ENABLED
        value: "true"
      - key: GIFT_WRAP_FEE
        sync: false
      # true = a shop's first "Publish" waits until a FrameX admin approves the product.
      - key: PRODUCT_MODERATION
        value: "false"
      - key: GEOCODER_PROVIDER
        value: nominatim
      - key: GEOCODER_CONTACT_EMAIL
        sync: false
      # Commission and payouts (an admin can change the three rates in the dashboard: Settings).
      - key: PLATFORM_COMMISSION_PERCENT
        sync: false
      - key: ARTIST_COMMISSION_PERCENT
        sync: false
      - key: PAYOUT_FEE_PERCENT
        sync: false
      # Seals the bank account numbers and UPI IDs of shops and artists. 32 random bytes as base64:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Set it once and keep it: details sealed with one key can't be opened with another.
      - key: PAYOUT_ENCRYPTION_KEY
        sync: false
      # Visitor statistics (only for visitors who allow them) and the optional Google Analytics 4 Measurement ID.
      - key: ANALYTICS_ENABLED
        sync: false
      - key: GA4_MEASUREMENT_ID
        sync: false
      # Emails: where replies go, and the address told about new contact messages.
      - key: EMAIL_REPLY_TO
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
