<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop photo frames — FrameX</title>
  <meta name="description"
    content="Browse photo frames from local shops. Search, filter by category and shop, and add frames to your cart.">
  <meta name="theme-color" content="#02030a">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050816'/%3E%3Crect x='7' y='8' width='18' height='16' rx='1.5' fill='none' stroke='%23ea780e' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@300;400;600;700;800&display=swap">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/chrome.css">
  <link rel="stylesheet" href="assets/css/catalog.css">
  <link rel="stylesheet" href="assets/css/story.css">
  <link rel="stylesheet" href="assets/css/overlays.css">
  <link rel="stylesheet" href="assets/css/footer-faq.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script>document.documentElement.classList.add("js");</script>
</head>

<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header-root"></div>

  <main id="main">
    <section class="page-banner" aria-labelledby="page-title">
      <div class="container">
        <nav class="page-banner__crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span
            aria-hidden="true">/</span> <span aria-current="page">Shop</span></nav>
        <h1 class="page-banner__title" id="page-title">Shop photo frames</h1>
        <p class="page-banner__lead">Browse frames from local shops. Search, filter by category and see what is in
          stock.</p>
      </div>
    </section>

    <section class="section" id="shops" aria-labelledby="shops-title">
      <div class="container">
        <div class="section-head" data-reveal>
          <div>
            <h2 class="section-title" id="shops-title">Shops</h2>
            <p class="section-lead">Choose a shop to see its profile and frames.</p>
          </div>
        </div>
        <div class="shops-toolbar" id="shops-toolbar">
          <button class="btn btn--dark btn--sm" type="button" id="shops-locate"><svg class="icon" aria-hidden="true">
              <use href="#i-pin"></use>
            </svg> Use my location</button>
          <div class="segmented" role="group" aria-label="Sort shops">
            <button class="chip" type="button" data-shop-sort="recommended" aria-pressed="true">Recommended</button>
            <button class="chip" type="button" data-shop-sort="nearest" aria-pressed="false" disabled>Nearest</button>
            <button class="chip" type="button" data-shop-sort="rating" aria-pressed="false" disabled>Top rated</button>
          </div>
          <p class="shops-toolbar__status" id="shops-status" role="status" aria-live="polite"></p>
        </div>
        <div class="shop-grid" id="shop-grid" aria-busy="true"></div>
      </div>
    </section>

    <section class="section section--tight-top" id="collection" aria-labelledby="collection-title">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title" id="collection-title">All frames</h2>
          <p class="catalog-count" id="collection-count" role="status" aria-live="polite"></p>
        </div>
        <div class="catalog-toolbar">
          <div class="catalog-toolbar__row">
            <label class="field catalog-toolbar__search"><span class="visually-hidden">Search frames</span><svg
                class="icon" aria-hidden="true">
                <use href="#i-search"></use>
              </svg><input class="input" id="collection-search" type="search" placeholder="Search frames"
                autocomplete="off"></label>
            <label class="catalog-toolbar__sort"><span class="visually-hidden">Sort frames</span>
              <select class="select" id="collection-sort">
                <option value="recommended">Recommended</option>
                <option value="price_asc">Price: low to high</option>
                <option value="price_desc">Price: high to low</option>
                <option value="newest">Newest</option>
              </select></label>
            <label class="switch"><input type="checkbox" id="collection-stock"><span>In stock only</span></label>
          </div>
          <div class="chip-scroll" id="collection-chips" role="group" aria-label="Filter by category"></div>
          <details class="catalog-filters" id="collection-filters" hidden>
            <summary>More filters <span class="catalog-filters__count" id="collection-filter-count"></span></summary>
            <div class="catalog-filters__grid" id="collection-filter-fields"></div>
          </details>
          <div class="shop-filter" id="collection-shop-filter" hidden><span>Showing frames from <strong
                id="collection-shop-name"></strong></span><button class="btn btn--outline btn--sm" type="button"
              id="collection-clear-shop">Show all shops</button></div>
        </div>
        <div class="product-grid" id="collection-grid" aria-busy="true"></div>
        <div class="catalog-more" id="collection-more" hidden><button class="btn btn--outline" type="button">Load more
            frames</button></div>
      </div>
    </section>
  </main>

  <div id="site-footer-root"></div>
  <div id="overlay-root"></div>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/core/dom.js" defer></script>
  <script src="assets/js/core/qs.js" defer></script>
  <script src="assets/js/core/constants.js" defer></script>
  <script src="assets/js/services/pricing.js" defer></script>
  <script src="assets/js/services/location.js" defer></script>
  <script src="assets/js/services/shop-utils.js" defer></script>
  <script src="assets/data/site.seed.js" defer></script>
  <script src="js/edit.js" defer></script>
  <script src="js/studio.js" defer></script>
  <script src="assets/data/reviews.seed.js" defer></script>
  <script src="assets/data/community.seed.js" defer></script>
  <script src="assets/data/faq.seed.js" defer></script>
  <script src="assets/data/gallery.seed.js" defer></script>
  <script src="assets/js/services/product-model.js" defer></script>
  <script src="assets/js/api/seed-provider.js" defer></script>
  <script src="assets/js/api/http-provider.js" defer></script>
  <script src="assets/js/api/api.js" defer></script>
  <script src="assets/js/store/cart.js" defer></script>
  <script src="assets/js/store/wishlist.js" defer></script>
  <script src="assets/js/ui/icons.js" defer></script>
  <script src="assets/js/ui/templates.js" defer></script>
  <script src="assets/js/ui/toast.js" defer></script>
  <script src="assets/js/ui/overlay.js" defer></script>
  <script src="assets/js/ui/reveal.js" defer></script>
  <script src="assets/js/ui/nav.js" defer></script>
  <script src="assets/js/ui/chrome.js" defer></script>
  <script src="assets/js/ui/cart-drawer.js" defer></script>
  <script src="assets/js/ui/actions.js" defer></script>
  <script src="assets/js/ui/shops.js" defer></script>
  <script src="assets/js/ui/collection.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>

</html>
